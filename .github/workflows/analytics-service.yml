name: analytics-service

on:
  push:
    branches: [main]
    paths:
      - "analytics-service/**"
      - ".github/workflows/analytics-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "analytics-service/**"
      - ".github/workflows/analytics-service.yml"
  workflow_dispatch:

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Instalar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar as dependencias
        run: pip install -r requirements.txt

      - name: Compilar (conferir se o codigo nao tem erro de escrita)
        run: python -m compileall -q .

      - name: Testes unitarios (se existirem)
        run: |
          if ls test_*.py tests 2>/dev/null; then
            pip install pytest
            pytest
          else
            echo "Nenhum teste unitario encontrado no codigo-base"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: build-test
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Instalar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar o flake8
        run: pip install flake8

      - name: Erros graves (bloqueia)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Estilo do codigo (informativo, nao bloqueia)
        run: flake8 . --count --exit-zero --max-line-length=120 --statistics

  security:
    name: Seguranca (SCA e SAST)
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Instalar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: SCA - Trivy nas dependencias (falha se houver vulnerabilidade CRITICA)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy:latest \
            fs --scanners vuln --severity CRITICAL --exit-code 1 /src/analytics-service

      - name: SAST - bandit no codigo (falha se houver problema de severidade alta)
        working-directory: analytics-service
        run: |
          pip install bandit
          bandit -r . -lll -iii

  image:
    name: Imagem Docker (build, scan e push)
    runs-on: ubuntu-24.04
    needs: [lint, security]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Definir a etiqueta da imagem (v1.0.0 + 7 primeiros caracteres do commit)
        id: tag
        run: echo "tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Construir a imagem
        run: docker build -t analytics-service:${{ steps.tag.outputs.tag }} ./analytics-service

      - name: Container scan - Trivy na imagem (falha se houver vulnerabilidade CRITICA com correcao)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 analytics-service:${{ steps.tag.outputs.tag }}

      - name: Entregar as credenciais do Lab para o pipeline
        if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login no ECR
        if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Enviar ao ECR a mesma imagem que passou pelo scan
        if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        run: |
          IMAGEM=${{ steps.ecr.outputs.registry }}/analytics-service:${{ steps.tag.outputs.tag }}
          docker tag analytics-service:${{ steps.tag.outputs.tag }} "$IMAGEM"
          docker push "$IMAGEM"

  gitops:
    name: Atualizar o GitOps
    runs-on: ubuntu-24.04
    needs: image
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: write
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Atualizar a etiqueta da imagem na pasta gitops
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          sed -i "s|\(image: .*/analytics-service:\).*|\1$TAG|" gitops/analytics-service.yaml
          if git diff --quiet; then
            echo "A etiqueta ja estava atualizada. Nada a fazer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/analytics-service.yaml
          git commit -m "gitops: analytics-service -> $TAG"
          for _ in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
