name: evaluation-service

on:
  push:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-service.yml"
  workflow_dispatch:

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: evaluation-service
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Instalar o Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Baixar as dependencias
        run: go mod tidy

      - name: Compilar
        run: go build ./...

      - name: Testes unitarios
        run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: build-test
    defaults:
      run:
        working-directory: evaluation-service
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Instalar o Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Baixar as dependencias
        run: go mod tidy

      - name: Instalar o golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Rodar o golangci-lint (informativo, nao bloqueia)
        run: golangci-lint run --issues-exit-code=0 ./...

  security:
    name: Seguranca (SCA e SAST)
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Instalar o Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Baixar as dependencias
        working-directory: evaluation-service
        run: go mod tidy

      - name: SCA - Trivy nas dependencias (falha se houver vulnerabilidade CRITICA)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy:latest \
            fs --scanners vuln --severity CRITICAL --exit-code 1 /src/evaluation-service

      - name: SAST - gosec no codigo (falha se houver problema de severidade alta)
        working-directory: evaluation-service
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity=high -confidence=high ./...

  image:
    name: Imagem Docker (build e scan)
    runs-on: ubuntu-24.04
    needs: [lint, security]
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Definir a etiqueta da imagem (7 primeiros caracteres do commit)
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Construir a imagem
        run: docker build -t evaluation-service:${{ env.IMAGE_TAG }} ./evaluation-service

      - name: Container scan - Trivy na imagem (falha se houver vulnerabilidade CRITICA com correcao)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 evaluation-service:${{ env.IMAGE_TAG }}
  deploy:
    name: Publicar no ECR e atualizar o GitOps
    runs-on: ubuntu-24.04
    needs: image
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: write
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Definir a etiqueta da imagem (7 primeiros caracteres do commit)
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Entregar as credenciais do Lab para o pipeline
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir e enviar a imagem para o ECR
        run: |
          IMAGEM=${{ steps.ecr.outputs.registry }}/evaluation-service:${{ env.IMAGE_TAG }}
          docker build -t "$IMAGEM" ./evaluation-service
          docker push "$IMAGEM"

      - name: Atualizar a etiqueta da imagem na pasta gitops
        run: |
          IMAGEM=${{ steps.ecr.outputs.registry }}/evaluation-service:${{ env.IMAGE_TAG }}
          sed -i "s|image: .*/evaluation-service:.*|image: $IMAGEM|" gitops/evaluation-service.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/evaluation-service.yaml
          git commit -m "gitops: evaluation-service -> ${{ env.IMAGE_TAG }}"
          for tentativa in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done